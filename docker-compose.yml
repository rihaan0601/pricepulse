version: '3.8'

services:
  api:
    build:
      context: ./harvester
    ports:
      - "8000:8000"
    volumes:
      - ./harvester:/app/harvester
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  web:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
    command: >
      sh -c "npm install && npm run dev"
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
