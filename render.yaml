services:
  - type: web
    name: pricepulse-backend
    env: docker
    dockerfilePath: ./harvester/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pricepulse-db
          property: connectionString

databases:
  - name: pricepulse-db
    databaseName: pricepulse_db
