services:
  - type: web
    name: pricepulse-backend
    env: docker
    dockerfilePath: ./harvester/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pricepulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: pricepulse-redis
          property: connectionString

  - type: redis
    name: pricepulse-redis
    plan: free
    region: singapore
    ipAllowList:
      - source: 0.0.0.0/0
        description: internal access

databases:
  - name: pricepulse-db
    plan: free
    region: singapore
    databaseName: pricepulse_db
    databaseUser: pricepulse_user
